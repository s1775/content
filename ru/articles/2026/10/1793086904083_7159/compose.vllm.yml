services:
  llm:
    image: vllm/vllm-openai-cpu:latest-x86_64
    container_name: llm
    restart: unless-stopped
    environment:
      - HF_TOKEN='SECRET_KEY'
    volumes:
      - llm-data:/root/.cache/huggingface:Z
    ports:
      - '8000:8000'
    ipc: host
  ui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: ui
    restart: unless-stopped
    environment:
      - OPENAI_API_BASE_URL=http://host.containers.internal:8000/v1
      - WEBUI_SECRET_KEY='SECRET_KEY'
    volumes:
      - ui-data:/app/backend/data:Z
    ports:
      - '3000:8080'
    depends_on:
      - llm
volumes:
  llm-data:
    driver: local
  ui-data:
    driver: local
