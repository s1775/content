services:
  llm:
    image: vllm/vllm-openai-cpu:latest-x86_64
    container_name: llm
    restart: unless-stopped
    environment:
      HF_TOKEN: 'SECRET_TOKEN'
      CUDA_VISIBLE_DEVICES: '0,1'
    volumes:
      - llm-cache:/root/.cache/huggingface:Z
    ports:
      - '8000:8000'
    ipc: host
    shm_size: '4g'
    command: >
      --model Qwen/Qwen2.5-1.5B-Instruct
      --gpu-memory-utilization 0.5
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
  ui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: ui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: 'http://host.containers.internal:8000/v1'
      OPENAI_API_KEY: 'none'
      WEBUI_SECRET_KEY: 'SECRET_KEY'
    volumes:
      - ui-data:/app/backend/data:Z
    ports:
      - '3000:8080'
    depends_on:
      - llm
volumes:
  llm-cache:
    driver: local
  ui-data:
    driver: local
