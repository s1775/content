name: llm
services:
  ollama:
    image: docker.io/ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama:Z
    ports:
      - '11434:11434'
    networks:
      - llm-net
  postgres:
    image: docker.io/postgres:18
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: 'PASSWORD'
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    networks:
      - llm_net
  qdrant:
    image: docker.io/qdrant/qdrant:1.18
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - '6333:6333'
      - '6334:6334'
    expose:
      - 6333
      - 6334
      - 6335
    networks:
      - llm_net
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
  redis:
    image: docker.io/redis:latest
    container_name: redis
    restart: unless-stopped
    volumes:
      - redis_data:/redis/storage
    ports:
      - '6333:6333'
      - '6334:6334'
    networks:
      - llm_net
  webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: webui
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: 'SECRET_KEY'
      CORS_ALLOW_ORIGIN: '*'
      OLLAMA_BASE_URL: 'http://ollama:11434'
      #DATABASE_URL: 'postgresql://user:password@postgres:5432/webui'
      #PGVECTOR_DB_URL: 'postgresql://user:password@postgres:5432/webui_vector'
      #VECTOR_DB: 'qdrant'
      #QDRANT_URI: 'http://qdrant:6333'
      #REDIS_URL: 'redis://redis:6379/0'
      #WEBSOCKET_MANAGER: 'redis'
      #ENABLE_WEBSOCKET_SUPPORT: true
      #CONTENT_EXTRACTION_ENGINE: 'tika'
      #TIKA_SERVER_URL: 'http://tika:9998'
      #RAG_EMBEDDING_ENGINE: 'openai'
      #UVICORN_WORKERS: 1
      #ENABLE_DB_MIGRATIONS: false
      #THREAD_POOL_SIZE: 2000
      #DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL: 120
      #ENABLE_ORJSON: true
      #ENABLE_CHAT_RESPONSE_STREAM_INPLACE_APPEND: true
      #AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER: true
    volumes:
      - webui_data:/app/backend/data:Z
    ports:
      - '3000:8080'
    networks:
      - llm_net
volumes:
  ollama_data:
  postgres_data:
  qdrant_data:
  webui_data:
networks:
  llm_net:
configs:
  qdrant_config:
    content: |
      log_level: INFO
