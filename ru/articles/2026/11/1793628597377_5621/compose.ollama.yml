name: ai
services:
  llm:
    image: docker.io/ollama/ollama:latest
    container_name: llm
    restart: unless-stopped
    volumes:
      - llm_data:/root/.ollama:Z
    ports:
      - '11434:11434'
    networks:
      - llm_net
  db:
    image: docker.io/postgres:18
    container_name: db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: 'PASSWORD'
    volumes:
      - db_data:/var/lib/postgresql
    ports:
      - '5432:5432'
    networks:
      - llm_net
  vector:
    image: docker.io/qdrant/qdrant:v1.18
    container_name: vector
    restart: unless-stopped
    volumes:
      - vector_data:/qdrant/storage
    ports:
      - '6333:6333'
      - '6334:6334'
    expose:
      - 6333
      - 6334
      - 6335
    networks:
      - llm_net
    configs:
      - source: vector_config
        target: /qdrant/config/production.yaml
  cache:
    image: docker.io/redis:latest
    container_name: cache
    restart: unless-stopped
    volumes:
      - cache_data:/data
    ports:
      - '6379:6379'
    networks:
      - llm_net
  ui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: ui
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: 'SECRET_KEY'
      CORS_ALLOW_ORIGIN: '*'
      OLLAMA_BASE_URL: 'http://llm:11434'
      #DATABASE_URL: 'postgresql://USER:PASSWORD@db:5432/ui'
      #PGVECTOR_DB_URL: 'postgresql://USER:PASSWORD@db:5432/ui_vector'
      #VECTOR_DB: 'qdrant'
      #QDRANT_URI: 'http://vector:6333'
      #REDIS_URL: 'redis://cache:6379/0'
      #WEBSOCKET_MANAGER: 'redis'
      #ENABLE_WEBSOCKET_SUPPORT: true
      #CONTENT_EXTRACTION_ENGINE: 'tika'
      #TIKA_SERVER_URL: 'http://tika:9998'
      #RAG_EMBEDDING_ENGINE: 'openai'
      #UVICORN_WORKERS: 1
      #ENABLE_DB_MIGRATIONS: false
      #THREAD_POOL_SIZE: 2000
      #DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL: 120
      #ENABLE_ORJSON: true
      #ENABLE_CHAT_RESPONSE_STREAM_INPLACE_APPEND: true
      #AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER: true
    volumes:
      - ui_data:/app/backend/data:Z
    ports:
      - '3000:8080'
    networks:
      - llm_net
volumes:
  llm_data:
    driver: local
  db_data:
    driver: local
  vector_data:
    driver: local
  cache_data:
    driver: local
  ui_data:
    driver: local
networks:
  llm_net:
    driver: bridge
configs:
  vector_config:
    content: |
      log_level: INFO
