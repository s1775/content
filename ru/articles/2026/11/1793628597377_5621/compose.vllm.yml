name: llm
services:
  vllm:
    image: docker.io/vllm/vllm-openai:latest
    container_name: vllm
    restart: unless-stopped
    environment:
      #HTTP_PROXY: 'http://user:password@example.com:3128/'
      #HTTPS_PROXY: 'http://user:password@example.com:3128/'
      #NO_PROXY: '127.0.0.1,localhost,host.containers.internal'
      HF_TOKEN: 'SECRET_TOKEN'
    volumes:
      - vllm-cache:/root/.cache/huggingface:Z
    ports:
      - '8000:8000'
    networks:
      - llm-net
    ipc: host
    command: [
      '--model', 'Qwen/Qwen2.5-1.5B-Instruct',
      '--gpu-memory-utilization', '0.5'
    ]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ['gpu']
    healthcheck:
      test: ['CMD-SHELL', 'curl -f --connect-timeout 4 --max-time 9 http://127.0.0.1:8000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1200s
  webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: webui
    restart: unless-stopped
    environment:
      WEBUI_SECRET_KEY: 'SECRET_KEY'
      CORS_ALLOW_ORIGIN: '*'
      #DATABASE_URL: 'postgresql://user:password@127.0.0.1:5432/ui'
      #PGVECTOR_DB_URL: 'postgresql://user:password@127.0.0.1:5432/llm'
      #VECTOR_DB: 'pgvector'
      #REDIS_URL: 'redis://redis-host:6379/0'
      #WEBSOCKET_MANAGER: 'redis'
      #ENABLE_WEBSOCKET_SUPPORT: true
      #CONTENT_EXTRACTION_ENGINE: 'tika'
      #TIKA_SERVER_URL: 'http://tika:9998'
      #RAG_EMBEDDING_ENGINE: 'openai'
      #UVICORN_WORKERS: 1
      #ENABLE_DB_MIGRATIONS: false
      #THREAD_POOL_SIZE: 2000
      #DATABASE_USER_ACTIVE_STATUS_UPDATE_INTERVAL: 120
      #ENABLE_ORJSON: true
      #ENABLE_CHAT_RESPONSE_STREAM_INPLACE_APPEND: true
      #AIOHTTP_CLIENT_ASYNC_DNS_RESOLVER: true
    volumes:
      - webui-data:/app/backend/data:Z
    ports:
      - '3000:8080'
    networks:
      - llm-net
volumes:
  vllm-cache:
    driver: local
  webui-data:
    driver: local
networks:
  llm-net:
