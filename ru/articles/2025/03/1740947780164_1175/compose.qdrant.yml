services:
  qdrant:
    image: docker.io/qdrant/qdrant:v1.18
    container_name: vector
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage:Z
    ports: ['6333:6333', '6334:6334']
    expose: ['6333', '6334', '6335']
    networks: ['example_net']
    configs:
      - source: qdrant_config
        target: /qdrant/config/production.yaml
volumes:
  qdrant_data:
    driver: local
networks:
  example_net:
    driver: bridge
configs:
  qdrant_config:
    content: |
      log_level: INFO
